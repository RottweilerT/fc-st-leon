name: Compter les profils (lecture seule)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import json, re, urllib.request
          KEY = re.search(r'apiKey:\s*"([^"]+)"', open("index.html", encoding="utf-8").read()).group(1)
          B = "https://firestore.googleapis.com/v1/projects/fc-st-leon/databases/(default)/documents/"
          for col in ("fc_players", "fc_matches", "fc_events"):
              try:
                  r = json.load(urllib.request.urlopen(f"{B}{col}?pageSize=300&key={KEY}"))
                  print(f"::notice::{col} : {len(r.get('documents', []))} documents lus sans connexion (comme un visiteur)")
              except Exception as e:
                  print(f"::notice::{col} : lecture refusée ou impossible ({e})")
          PY
