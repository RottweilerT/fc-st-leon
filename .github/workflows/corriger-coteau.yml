name: Corriger « Jean Cocteau » en « Jean Coteau »

# Correction ponctuelle du nom du stade dans le calendrier (lieu et note des séances),
# sans déclencher de notification « séance modifiée » : l'état gardé par les notifications est corrigé en même temps.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency: notifications

jobs:
  corriger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reprendre l'état des notifications
        uses: actions/cache/restore@v4
        with:
          path: /tmp/etat-notifs
          key: etat-notifs-${{ github.run_id }}
          restore-keys: etat-notifs-
      - name: Corriger
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          KEY = re.search(r'apiKey:\s*"([^"]+)"', open("index.html", encoding="utf-8").read()).group(1)
          B = "https://firestore.googleapis.com/v1/projects/fc-st-leon/databases/(default)/documents/fc_events"
          fix = lambda t: re.sub(r"Cocteau", "Coteau", t)
          docs, tok = [], ""
          while True:
              r = json.load(urllib.request.urlopen(f"{B}?pageSize=300&key={KEY}" + (f"&pageToken={tok}" if tok else "")))
              docs += r.get("documents", []); tok = r.get("nextPageToken")
              if not tok: break
          n = 0
          for d in docs:
              f = d.get("fields", {}); i = d["name"].split("/")[-1]; upd = {}
              for k in ("place", "note", "title", "body"):
                  v = f.get(k, {}).get("stringValue")
                  if v and "Cocteau" in v: upd[k] = fix(v)
              if not upd: continue
              mask = "&".join("updateMask.fieldPaths=" + k for k in upd)
              body = json.dumps({"fields": {k: {"stringValue": v} for k, v in upd.items()}}).encode()
              urllib.request.urlopen(urllib.request.Request(f"{B}/{i}?key={KEY}&{mask}&currentDocument.exists=true", data=body, method="PATCH", headers={"Content-Type": "application/json"})).read()
              n += 1; print(f"{i} {f.get('date', {}).get('stringValue', '')} : {upd}")
          print(f"::notice::{n} séance(s) corrigée(s) dans la base")
          p = "/tmp/etat-notifs/etat.json"
          if os.path.exists(p):
              etat = json.load(open(p)); m = 0
              for i, a in etat.items():
                  if "Cocteau" in (a.get("lieu") or ""): a["lieu"] = fix(a["lieu"]); m += 1
              json.dump(etat, open(p, "w"), ensure_ascii=False, sort_keys=True)
              print(f"::notice::état des notifications corrigé ({m} séance(s)) : aucune notification ne partira pour ce changement")
          else:
              print("::notice::pas d'état de notifications enregistré : rien à corriger de ce côté")
          PY
      - name: Garder l'état corrigé
        uses: actions/cache/save@v4
        with:
          path: /tmp/etat-notifs
          key: etat-notifs-${{ github.run_id }}
