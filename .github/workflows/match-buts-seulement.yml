name: Match en « buts seulement »

# Passe un match enregistré en « buts seulement » (champ lite=true) : l'appli n'y garde
# que les buts marqués et encaissés, le reste s'affiche N/A. Les stats d'origine restent
# dans la base (bouton « Rétablir toutes les stats » dans Résultats).
# Sans identifiant, n'agit que s'il y a exactement un match enregistré.
on:
  workflow_dispatch:
    inputs:
      match:
        description: "Identifiant du match (vide = le seul match enregistré)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  lite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Passer le match en buts seulement
        env:
          MATCH: ${{ github.event.inputs.match }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request
          KEY = re.search(r'apiKey:\s*"([^"]+)"', open("index.html", encoding="utf-8").read()).group(1)
          base = "https://firestore.googleapis.com/v1/projects/fc-st-leon/databases/(default)/documents/fc_matches"
          def val(v):
              for t in ("stringValue", "booleanValue", "doubleValue"):
                  if t in v: return v[t]
              if "integerValue" in v: return int(v["integerValue"])
              if "arrayValue" in v: return [val(x) for x in v["arrayValue"].get("values", [])]
              if "mapValue" in v: return {k: val(x) for k, x in v["mapValue"].get("fields", {}).items()}
              return None
          docs = json.load(urllib.request.urlopen(f"{base}?pageSize=300&key={KEY}")).get("documents", [])
          print(len(docs), "match(s) enregistré(s)")
          want = (os.environ.get("MATCH") or "").strip()
          if want:
              docs = [d for d in docs if d["name"].split("/")[-1] == want]
              if not docs: sys.exit("Match introuvable : " + want)
          elif len(docs) != 1:
              for d in docs:
                  f = {k: val(v) for k, v in d.get("fields", {}).items()}
                  print(" -", d["name"].split("/")[-1], f.get("date"), f.get("adv"))
              sys.exit("Plusieurs matchs : relance avec l'identifiant du match.")
          d = docs[0]; mid = d["name"].split("/")[-1]
          f = {k: val(v) for k, v in d.get("fields", {}).items()}
          print(f"Match {mid} : {f.get('date')} contre {f.get('adv')} · {f.get('us')}-{f.get('them')}")
          for r in f.get("rows") or []:
              print(f"   {r.get('name')} ({r.get('pos')}, {r.get('min')} min) : buts {r.get('b') or 0}, buts encaissés {r.get('enc') or 0}")
          body = json.dumps({"fields": {"lite": {"booleanValue": True}}}).encode()
          url = f"{base}/{mid}?key={KEY}&updateMask.fieldPaths=lite&currentDocument.exists=true"
          urllib.request.urlopen(urllib.request.Request(url, data=body, method="PATCH", headers={"Content-Type": "application/json"})).read()
          print("OK : match passé en « buts seulement ».")
          PY
