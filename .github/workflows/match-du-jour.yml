name: Enregistrer le match du 24/10 (buts seulement)

# Ajout ponctuel du match du 24/10/2026 contre TP Carthage - Hannibal (0-3), en « buts seulement ».
# mode=lire : vérifie la correspondance des 9 noms avec les profils inscrits, n'écrit rien.
# mode=ecrire : enregistre le match (identifiant fixe, relancer ne crée pas de doublon).
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [lire, ecrire]
        default: lire

permissions:
  contents: read

jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match du 24/10
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, unicodedata, urllib.request, datetime
          KEY = re.search(r'apiKey:\s*"([^"]+)"', open("index.html", encoding="utf-8").read()).group(1)
          B = "https://firestore.googleapis.com/v1/projects/fc-st-leon/databases/(default)/documents/"
          def lst(col):
              out, tok = [], ""
              while True:
                  r = json.load(urllib.request.urlopen(f"{B}{col}?pageSize=300&key={KEY}" + (f"&pageToken={tok}" if tok else "")))
                  out += r.get("documents", []); tok = r.get("nextPageToken")
                  if not tok: return out
          s = lambda f, k: f.get(k, {}).get("stringValue", "")
          norm = lambda t: re.sub(r"[^a-z]", "", unicodedata.normalize("NFD", t.lower()))
          players = {}
          for d in lst("fc_players"):
              f = d.get("fields", {}); i = d["name"].split("/")[-1]
              players[i] = (s(f, "first") + " " + s(f, "last")).strip()
          WANT = ["Florent Manternach", "Francesco Giambri", "Thomas de Francqueville", "Guillaume Masquin", "Philippe Kollen",
                  "Armand Dubourg", "François Riveron", "Maxence Dubourg", "Giuseppe Giambri"]
          found, missing = [], []
          for w in WANT:
              hit = [i for i, n in players.items() if norm(n) == norm(w)]
              if not hit:   # first name + start of last name (e.g. "Florent M.", "Guillaume")
                  fn = norm(w.split()[0]); ln = norm(" ".join(w.split()[1:]))
                  hit = [i for i, n in players.items() if norm(n.split()[0] if n.split() else "") == fn and (not n.split()[1:] or ln.startswith(norm(" ".join(n.split()[1:]))) or norm(" ".join(n.split()[1:])).startswith(ln[:3]))]
              if len(hit) == 1: found.append((w, hit[0], players[hit[0]]))
              else: missing.append((w, [players[i] for i in hit]))
          print("::notice::Correspondances : " + " ; ".join(f"{w} = {n} ({i})" for w, i, n in found))
          print("::notice::Non trouvés : " + (" ; ".join(f"{w} (candidats : {c or 'aucun'})" for w, c in missing) or "aucun"))
          print("::notice::Inscrits : " + " ; ".join(sorted(players.values())))
          same = [d["name"].split("/")[-1] for d in lst("fc_matches") if s(d.get("fields", {}), "date") == "2026-10-24"]
          print("::notice::Matchs déjà enregistrés le 24/10 : " + (", ".join(same) or "aucun"))
          if os.environ.get("MODE") != "ecrire": sys.exit(0)
          if missing: sys.exit("Des joueurs ne sont pas trouvés : rien n'est écrit.")
          def V(v):
              if isinstance(v, bool): return {"booleanValue": v}
              if isinstance(v, int): return {"integerValue": str(v)}
              if isinstance(v, dict): return {"mapValue": {"fields": {k: V(x) for k, x in v.items()}}}
              if isinstance(v, list): return {"arrayValue": {"values": [V(x) for x in v]}}
              return {"stringValue": v}
          K = ["pr","pm","dr","dm","tr","tm","b","pd","rec","per","f","arr","enc","drb","drm"]
          rows = []
          for w, i, n in found:
              r = {"id": i, "name": n, "pos": "G" if norm(w) == norm("Maxence Dubourg") else "", "starter": True, "min": 0}
              r.update({k: 0 for k in K})
              if r["pos"] == "G": r["enc"] = 3
              rows.append(r)
          doc = {"date": "2026-10-24", "adv": "TP Carthage - Hannibal", "form": "231", "us": 0, "them": 3, "lite": True, "v": 2,
                 "at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.000Z"), "rows": rows, "hist": [], "spells": []}
          url = f"{B}fc_matches/m-20261024-carthage?key={KEY}"
          urllib.request.urlopen(urllib.request.Request(url, data=json.dumps({"fields": {k: V(v) for k, v in doc.items()}}).encode(), method="PATCH", headers={"Content-Type": "application/json"})).read()
          print(f"::notice::Match enregistré : 0-3 contre TP Carthage - Hannibal, {len(rows)} joueurs, 3 buts encaissés pour le gardien")
          PY
