name: Enregistrer le match du 07/11 (buts seulement)
# Ajout ponctuel du match du 07/11/2026 contre Les Gars de la Ville (4-3), en « buts seulement ».
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match du 07/11
        run: |
          python3 - <<'PY'
          import json, re, sys, unicodedata, urllib.request, datetime
          KEY = re.search(r'apiKey:\s*"([^"]+)"', open("index.html", encoding="utf-8").read()).group(1)
          B = "https://firestore.googleapis.com/v1/projects/fc-st-leon/databases/(default)/documents/"
          def lst(col):
              out, tok = [], ""
              while True:
                  r = json.load(urllib.request.urlopen(f"{B}{col}?pageSize=300&key={KEY}" + (f"&pageToken={tok}" if tok else "")))
                  out += r.get("documents", []); tok = r.get("nextPageToken")
                  if not tok: return out
          s = lambda f, k: f.get(k, {}).get("stringValue", "")
          norm = lambda t: re.sub(r"[^a-z]", "", unicodedata.normalize("NFD", t.lower()))
          players = {d["name"].split("/")[-1]: (s(d.get("fields", {}), "first") + " " + s(d.get("fields", {}), "last")).strip() for d in lst("fc_players")}
          # joueur, buts marqués, buts encaissés (gardien)
          WANT = [("Pierre Chailley", 0, 0), ("Martin Solier", 0, 0), ("Giuseppe Giambri", 1, 0), ("Guillaume Masquin", 0, 0), ("Armand Charrin", 1, 0),
                  ("Philippe Kollen", 2, 0), ("Sixte Brulé", 0, 0), ("Armand du Bourg", 0, 0), ("Maxence du Bourg", 0, 3)]
          found, missing = [], []
          for w, b, enc in WANT:
              hit = [i for i, n in players.items() if norm(n) == norm(w)]
              (found.append((w, hit[0], players[hit[0]], b, enc)) if len(hit) == 1 else missing.append(w))
          print("::notice::Correspondances : " + " ; ".join(f"{w} = {n}" for w, i, n, b, e in found))
          if missing:
              print("::notice::Non trouvés : " + " ; ".join(missing) + " | Inscrits : " + " ; ".join(sorted(players.values())))
              sys.exit("Joueurs non trouvés : rien n'est écrit.")
          same = [d["name"].split("/")[-1] for d in lst("fc_matches") if s(d.get("fields", {}), "date") == "2026-11-07"]
          if same: sys.exit("Un match existe déjà le 07/11 (" + ", ".join(same) + ") : rien n'est écrit.")
          def V(v):
              if isinstance(v, bool): return {"booleanValue": v}
              if isinstance(v, int): return {"integerValue": str(v)}
              if v is None: return {"nullValue": None}
              if isinstance(v, dict): return {"mapValue": {"fields": {k: V(x) for k, x in v.items()}}}
              if isinstance(v, list): return {"arrayValue": {"values": [V(x) for x in v]}}
              return {"stringValue": v}
          K = ["pr","pm","dr","dm","tr","tm","b","pd","rec","per","f","arr","enc","drb","drm"]
          rows, hist = [], []
          for w, i, n, b, enc in found:
              r = {"id": i, "name": n, "pos": "G" if enc else "", "starter": True, "min": 0}; r.update({k: 0 for k in K})
              r["b"] = b; r["tr"] = b; r["enc"] = enc; rows.append(r)
              for _ in range(b): hist.append({"m": None, "h": 0, "ev": "But", "p": n, "d": "Ajouté après le match · minute non précisée", "added": True, "k": "b", "id": i})
              for _ in range(enc): hist.append({"m": None, "h": 0, "ev": "But encaissé", "p": n, "d": "Ajouté après le match · minute non précisée", "added": True, "k": "enc", "id": i})
          us = sum(x[3] for x in found); them = sum(x[4] for x in found)
          doc = {"date": "2026-11-07", "adv": "Les Gars de la Ville", "form": "231", "us": us, "them": them, "lite": True, "v": 2,
                 "at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.000Z"), "rows": rows, "hist": hist, "spells": []}
          url = f"{B}fc_matches/m-20261107-gars-de-la-ville?key={KEY}&currentDocument.exists=false"
          urllib.request.urlopen(urllib.request.Request(url, data=json.dumps({"fields": {k: V(v) for k, v in doc.items()}}).encode(), method="PATCH", headers={"Content-Type": "application/json"})).read()
          print(f"::notice::Match enregistré : {us}-{them} contre Les Gars de la Ville, {len(rows)} joueurs")
          PY
