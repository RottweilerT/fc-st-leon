name: Notifications

# Envoie les notifications de l'appli aux téléphones qui les ont activées (Firebase Cloud Messaging) :
#  - toutes les 15 minutes : séance modifiée ou annulée, nouvelle séance, résultat de match enregistré ;
#  - le samedi à 16 h (heure de Paris) : rappel d'indiquer ses présences pour la semaine ;
#  - à la main (bouton « Run workflow », mode « message ») : un message rédigé par l'administrateur.
# Seules les personnes qui ont le droit d'écrire dans ce dépôt GitHub peuvent lancer un envoi à la main :
# le contrôle est fait par GitHub, pas par l'appli.
# Le programme est dans .github/notifications.py. Le secret FCM_COMPTE contient le compte de service Firebase.
on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "0 14 * * 6"
    - cron: "0 15 * * 6"
  workflow_dispatch:
    inputs:
      mode:
        description: "message = ton message ; test = notification de test à tous ; rappel = rappel du samedi tout de suite ; changements = vérifier le calendrier"
        required: true
        default: "message"
        type: choice
        options: [message, test, rappel, changements]
      titre:
        description: "Message : titre (60 caractères au plus)"
        required: false
        default: ""
      texte:
        description: "Message : texte (240 caractères au plus)"
        required: false
        default: ""
      categorie:
        description: "Message : envoyé aux abonnés de… info = message de l'équipe, cal = calendrier, res = résultats"
        required: false
        default: "info"
        type: choice
        options: [info, cal, nouv, res]
      lien:
        description: "Message : onglet ouvert au toucher (vide = accueil)"
        required: false
        default: ""
        type: choice
        options: ["", calendrier, resultats, stats, effectif]
      apercu:
        description: "Message : aperçu seulement (affiche le message et le nombre de destinataires, n'envoie rien)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency: notifications

jobs:
  notifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Choisir le mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then m="${{ github.event.inputs.mode }}"; f=1
          elif [ "${{ github.event.schedule }}" = "*/15 * * * *" ]; then m=changements; f=0
          else m=rappel; f=0; fi
          echo "mode=$m" >> "$GITHUB_OUTPUT"; echo "forcer=$f" >> "$GITHUB_OUTPUT"
      - name: Vérifier le secret
        id: secret
        env:
          FCM_COMPTE: ${{ secrets.FCM_COMPTE }}
        run: |
          if [ -z "$FCM_COMPTE" ]; then echo "::warning::Secret FCM_COMPTE absent : notifications pas encore activées."; echo "ok=0" >> "$GITHUB_OUTPUT"; else echo "ok=1" >> "$GITHUB_OUTPUT"; fi
      - name: Reprendre l'état du calendrier
        if: steps.secret.outputs.ok == '1' && steps.mode.outputs.mode == 'changements'
        uses: actions/cache/restore@v4
        with:
          path: /tmp/etat-notifs
          key: etat-notifs-${{ github.run_id }}
          restore-keys: etat-notifs-
      - name: Envoyer
        id: envoi
        if: steps.secret.outputs.ok == '1'
        env:
          APP: foot
          PROJET: fc-st-leon
          SITE: https://rottweilert.github.io/fc-st-leon/
          MODE: ${{ steps.mode.outputs.mode }}
          FORCER: ${{ steps.mode.outputs.forcer }}
          FCM_COMPTE: ${{ secrets.FCM_COMPTE }}
          TITRE: ${{ github.event.inputs.titre }}
          TEXTE: ${{ github.event.inputs.texte }}
          CATEGORIE: ${{ github.event.inputs.categorie }}
          LIEN: ${{ github.event.inputs.lien }}
          APERCU: ${{ github.event.inputs.apercu }}
        run: |
          pip install -q google-auth requests
          python3 .github/notifications.py
      - name: Garder l'état du calendrier
        if: steps.envoi.outputs.change == '1'
        uses: actions/cache/save@v4
        with:
          path: /tmp/etat-notifs
          key: etat-notifs-${{ github.run_id }}
